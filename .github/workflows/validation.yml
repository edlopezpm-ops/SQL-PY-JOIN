name: Validation

on:
  pull_request:
    branches: ['practice/sql-python-saas']
  push:
    branches: ['practice/sql-python-saas']

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate against disposable SQL Server
        run: bash tests/validate_sql.sh
