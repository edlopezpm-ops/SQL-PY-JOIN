name: Validation

on:
  pull_request:
    branches: ['practice/sql-python-saas']
  push:
    branches: ['practice/sql-python-saas']

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate against disposable SQL Server
        run: bash tests/validate_sql.sh
